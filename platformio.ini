; Dev/CI de la propia librería: valida el protocolo + el ruteo en host (native), sin ESP32.
; No afecta a los consumidores — se excluye del paquete vía library.json (export.exclude).
;   pio test -e native
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
; NATIVE_BUILD → excluye EspNowTransport.cpp (solo-ESP32). -I src para <input_control/...>.
build_flags = -std=c++17 -DNATIVE_BUILD -I src
; Compila src/ dentro del test: test_module linkea InputControlModule.cpp + ButtonRouter.cpp
; (los tests header-only —protocol/config— no lo necesitaban). EspNowTransport.cpp queda
; vacío por NATIVE_BUILD, así que no arrastra dependencias de ESP32.
test_build_src = yes
lib_deps = throwtheswitch/Unity@^2.6.1
